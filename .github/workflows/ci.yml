name: CI Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: '2. Gitleaks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: zricethezav/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  eslint:
    name: '3. ESLint'
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  prettier:
    name: '4. Prettier'
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  hadolint:
    name: '5. Hadolint'
    needs: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  unit-tests:
    name: '6. Unit tests and coverage'
    needs: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  sonarcloud:
    name: '7. SonarCloud'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src,frontend
            -Dsonar.tests=backend/src/test
            -Dsonar.exclusions=backend/src/test/**,.github/**,infra/**,scripts/**,monitoring/**,docs/**,build-test.sh,**/Dockerfile
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

  snyk:
    name: '8. Snyk dependency scan'
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Test dependencies with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npm exec --yes --package=snyk -- snyk test --all-projects --severity-threshold=high
        working-directory: backend

  docker-build:
    name: '9. Docker build'
    needs: snyk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag taskflow-backend:ci --file backend/Dockerfile backend
      - name: Build frontend image
        run: docker build --tag taskflow-frontend:ci --file frontend/Dockerfile frontend
      - name: Save images for the Trivy job
        run: docker save taskflow-backend:ci taskflow-frontend:ci --output images.tar
      - name: Upload images for the Trivy job
        uses: actions/upload-artifact@v4
        with:
          name: ci-images
          path: images.tar
          retention-days: 1

  trivy:
    name: '10. Trivy image scan'
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Download images from the build job
        uses: actions/download-artifact@v4
        with:
          name: ci-images
      - name: Load images for scanning
        run: docker load --input images.tar
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: taskflow-backend:ci
          version: v0.76.2
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: taskflow-frontend:ci
          version: v0.76.2
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
