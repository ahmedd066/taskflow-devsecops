name: CD Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "078852546033"
  ECR_BACKEND_REPO: url-shortener-backend
  ECR_FRONTEND_REPO: url-shortener-frontend
  LAUNCH_TEMPLATE_ID: lt-014537a1cb74e6918
  ASG_NAME: url-shortener-asg
  ALB_DNS_NAME: taskflow-alb-1472473679.ap-southeast-2.elb.amazonaws.com
  OIDC_ROLE_ARN: arn:aws:iam::078852546033:role/github-actions-deploy

jobs:
  deploy:
    name: '11. Build & Push to ECR'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get short Git SHA for image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND_REPO }}:${{ steps.vars.outputs.IMAGE_TAG }} ./backend
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND_REPO }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND_REPO }}:${{ steps.vars.outputs.IMAGE_TAG }} ./frontend
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND_REPO }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Output image tag for next jobs
        run: echo "IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}" >> $GITHUB_ENV

  instance-refresh:
    name: '12. ASG Instance Refresh'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create new Launch Template version with updated image tag
        id: lt-version
        run: |
          IMAGE_TAG="${{ needs.deploy.outputs.image_tag }}"
          echo "Creating Launch Template version with IMAGE_TAG=${IMAGE_TAG}"

          # Validate image tag
          if [[ ! "$IMAGE_TAG" =~ ^sha-[a-f0-9]+$ ]]; then
            echo "ERROR: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

          # Read the actual startup script from the repository
          if [[ ! -f infra/ec2-user-data.sh ]]; then
            echo "ERROR: infra/ec2-user-data.sh not found"
            exit 1
          fi

          # Inject the immutable image tag into the startup script
          USER_DATA=$(sed \
            "s|^# IMAGE_TAG is provided at runtime via Launch Template user data (no default)$|IMAGE_TAG=\"${IMAGE_TAG}\"|" \
            infra/ec2-user-data.sh)

          # Verify that the image tag was injected
          if ! grep -q "^IMAGE_TAG=\"${IMAGE_TAG}\"$" <<< "$USER_DATA"; then
            echo "ERROR: IMAGE_TAG injection failed"
            exit 1
          fi

          # Encode the complete startup script
          ENCODED_USER_DATA=$(printf '%s' "$USER_DATA" | base64 -w 0)

          # Create a new Launch Template version with complete User Data
          LT_DATA=$(jq -n --arg userData "$ENCODED_USER_DATA" \
            '{UserData: $userData}')

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${{ env.LAUNCH_TEMPLATE_ID }} \
            --source-version '$Latest' \
            --launch-template-data "$LT_DATA" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "NEW_LT_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created Launch Template version: ${NEW_VERSION}"

          # Verify the newly created version contains the startup script
          VERIFY_DATA=$(aws ec2 describe-launch-template-versions \
            --launch-template-id ${{ env.LAUNCH_TEMPLATE_ID }} \
            --versions "$NEW_VERSION" \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData.UserData' \
            --output text)

          DECODED_DATA=$(printf '%s' "$VERIFY_DATA" | base64 --decode)

          if ! grep -q "^IMAGE_TAG=\"${IMAGE_TAG}\"$" <<< "$DECODED_DATA"; then
            echo "ERROR: Launch Template User Data verification failed"
            exit 1
          fi

          echo "Verified: complete startup script exists in Launch Template version ${NEW_VERSION}"

      - name: Set ASG Desired Capacity
        run: |
          # Set desired capacity to 2 (or current max if less) before instance refresh
          aws autoscaling set-desired-capacity \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --desired-capacity 2 \
            --region ${{ env.AWS_REGION }}
          echo "Set ASG desired capacity to 2"

      - name: Start ASG Instance Refresh
        id: refresh
        run: |
          # Wait for any existing in-progress refresh to complete (CLI version may not support cancel)
          echo "Checking for existing instance refresh..."
          for i in {1..60}; do
            EXISTING=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --query 'InstanceRefreshes[?Status==`InProgress` || Status==`Pending`].InstanceRefreshId' \
              --output text)
            if [[ -z "$EXISTING" ]]; then
              echo "No in-progress refresh found"
              break
            fi
            echo "Waiting for existing refresh $EXISTING to complete... (attempt $i/60)"
            sleep 30
          done
          # Verify no refresh still in progress
          EXISTING=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --query 'InstanceRefreshes[?Status==`InProgress` || Status==`Pending`].InstanceRefreshId' \
            --output text)
          if [[ -n "$EXISTING" ]]; then
            echo "ERROR: Instance refresh still in progress after timeout"
            exit 1
          fi
          REFRESH_OUTPUT=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300, "SkipMatching": true}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "INSTANCE_REFRESH_ID=${REFRESH_OUTPUT}" >> $GITHUB_OUTPUT
          echo "Started instance refresh: ${REFRESH_OUTPUT}"

      - name: Wait for Instance Refresh to Complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.INSTANCE_REFRESH_ID }}"
          echo "Waiting for instance refresh $REFRESH_ID to complete..."
          for i in {1..60}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Instance refresh status: $STATUS"
            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance refresh completed successfully"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance refresh $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "Timeout waiting for instance refresh"
          exit 1

  smoke-test:
    name: '13. Smoke Test'
    needs: [instance-refresh, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test against ALB
        env:
          ALB_DNS: ${{ env.ALB_DNS_NAME }}
          IMAGE_TAG: ${{ needs.deploy.outputs.image_tag }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${ALB_DNS}"